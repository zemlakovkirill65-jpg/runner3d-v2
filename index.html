<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рельсы Ярости 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #091224; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; }
  #gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; inset: 0; z-index: 6; pointer-events: none; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .hud.hidden { display: none; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .stats { display: flex; gap: 7px; flex-wrap: wrap; }
  .stat { background: rgba(10, 18, 34, 0.86); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 7px 11px; }
  .stat small { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat b { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat b.gold { color: #fbbf24; }
  .stat b.combo { color: #38bdf8; }
  .stat b.fps { color: #4ade80; }
  .top-actions { display: flex; gap: 6px; pointer-events: auto; }
  .hbtn { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(255,255,255,0.22); color: #fff; border-radius: 11px; padding: 9px 12px; font-size: 13px; font-weight: 700; }
  .boosts-hud { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-width: 270px; }
  .b-pill { background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 5px 10px; font-size: 12px; font-weight: 800; }
  .b-pill.ev { border-color: #38bdf8; color: #e0f2fe; background: rgba(14, 116, 144, 0.9); }
  .b-pill.boss { border-color: #facc15; color: #fef9c3; background: rgba(133, 77, 14, 0.92); }
  .b-pill.shield { border-color: #22d3ee; color: #cffafe; background: rgba(14, 116, 144, 0.86); }
  .alert { align-self: center; margin-top: 6px; background: rgba(15, 23, 42, 0.94); border: 1.5px solid #38bdf8; color: #e0f2fe; padding: 7px 16px; border-radius: 999px; font-size: 12px; font-weight: 800; opacity: 0; transition: opacity 0.22s; }
  .alert.warn { border-color: #f43f5e; color: #fecdd3; background: rgba(136, 19, 55, 0.94); }
  .alert.show { opacity: 1; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .gear-btns { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
  .gear-btn { border: none; color: #fff; border-radius: 14px; padding: 11px 14px; font-size: 13px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
  .gear-btn.dash { background: linear-gradient(135deg, #10b981, #06b6d4); color: #042f2e; }
  .gear-btn.board { background: linear-gradient(135deg, #f97316, #ec4899); }
  .gear-btn.jet { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .gear-btn:disabled { opacity: 0.38; filter: grayscale(0.75); box-shadow: none; }
  .screen { position: fixed; inset: 0; z-index: 20; background: rgba(7, 13, 25, 0.92); display: flex; flex-direction: column; padding: 16px; overflow-y: auto; }
  .screen.hidden { display: none; }
  .screen-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .brand { font-size: 20px; font-weight: 900; color: #38bdf8; letter-spacing: -0.02em; }
  .wallet { background: rgba(251, 191, 36, 0.14); border: 1px solid rgba(251, 191, 36, 0.4); color: #fbbf24; padding: 7px 12px; border-radius: 12px; font-weight: 800; font-size: 14px; }
  .nav-tabs { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; padding-bottom: 4px; }
  .ntab { flex: 1 0 auto; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: #162033; color: #cbd5e1; font-size: 13px; font-weight: 800; }
  .ntab.active { background: #22c55e; color: #052e16; border-color: #4ade80; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .scard { background: #131c2e; border: 1.5px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 7px; }
  .scard.eq { border-color: #22c55e; background: rgba(34, 197, 94, 0.08); }
  .preview-strip { height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); }
  .stitle { font-size: 15px; font-weight: 800; }
  .sinfo { font-size: 11px; color: #94a3b8; line-height: 1.35; }
  .sbtn { margin-top: auto; padding: 9px; border: none; border-radius: 10px; font-size: 12px; font-weight: 900; background: #fbbf24; color: #0f172a; }
  .sbtn.pick { background: #e2e8f0; color: #0f172a; }
  .sbtn.done { background: #22c55e; color: #052e16; }
  .footer-bar { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
  .main-cta { width: 100%; padding: 15px; border: none; border-radius: 15px; background: linear-gradient(90deg, #22c55e, #10b981); color: #052e16; font-size: 17px; font-weight: 900; }
  .sec-cta { width: 100%; padding: 13px; border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; background: #1e293b; color: #f8fafc; font-size: 14px; font-weight: 800; }
  .legend { font-size: 11px; color: #94a3b8; text-align: center; line-height: 1.45; }
  .center-box { margin: auto; width: 100%; max-width: 440px; background: #111827; border: 1px solid rgba(255,255,255,0.16); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="hud hidden" id="hud">
  <div>
    <div class="top">
      <div class="stats">
        <div class="stat"><small>Счёт</small><b id="hScore">0</b></div>
        <div class="stat"><small>Монеты</small><b class="gold" id="hCoins">0</b></div>
        <div class="stat"><small>Серия</small><b class="combo" id="hCombo">x1</b></div>
        <div class="stat"><small>FPS</small><b class="fps" id="hFps">60</b></div>
      </div>
      <div class="top-actions">
        <button class="hbtn" id="hSound" type="button">🔊</button>
        <button class="hbtn" id="hPause" type="button">⏸</button>
      </div>
    </div>
    <div class="boosts-hud" id="boostsHud"></div>
    <div class="alert" id="alertBox"></div>
  </div>
  <div class="bottom">
    <div class="stat"><small>Рекорд</small><b id="hBest" style="font-size:15px">0</b></div>
    <div class="gear-btns">
      <button class="gear-btn dash" id="btnDash" type="button" disabled>⚡ Рывок</button>
      <button class="gear-btn jet" id="btnJet" type="button" disabled>🚀 Джетпак</button>
      <button class="gear-btn board" id="btnBoard" type="button" disabled>🛹 Доска</button>
    </div>
  </div>
</div>
<div class="screen" id="mainScreen">
  <div class="screen-head">
    <div>
      <div class="brand">РЕЛЬСЫ ЯРОСТИ 3D · HD</div>
      <div style="font-size:12px;color:#94a3b8" id="biomeLabel">Локация: Городские пути · Рекорд: 0</div>
    </div>
    <div class="wallet">🪙 <span id="mCoins">800</span></div>
  </div>
  <div class="nav-tabs">
    <button class="ntab active" data-sec="skins" type="button">Скины</button>
    <button class="ntab" data-sec="boards" type="button">Доски</button>
    <button class="ntab" data-sec="boots" type="button">Ботинки</button>
    <button class="ntab" data-sec="jetpacks" type="button">Джетпак</button>
    <button class="ntab" data-sec="upgrades" type="button">Улучшения</button>
  </div>
  <div class="shop-grid" id="shopGrid"></div>
  <div class="footer-bar">
    <button class="main-cta" id="btnPlay" type="button">ЗАПУСТИТЬ ЗАБЕГ</button>
    <div class="legend">Свайп влево/вправо — полоса · Свайп вверх — прыжок / на вагон · Свайп вниз — перекат · Кнопка «Рывок» — импульс</div>
  </div>
</div>
<div class="screen hidden" id="pauseScreen">
  <div class="center-box">
    <div class="brand">ПАУЗА</div>
    <div class="sinfo" id="pauseStats">Счёт: 0 · Монеты за забег: 0</div>
    <button class="main-cta" id="btnResume" type="button">ПРОДОЛЖИТЬ</button>
    <button class="sec-cta" id="btnPauseShop" type="button">В МАГАЗИН / МЕНЮ</button>
  </div>
</div>
<div class="screen hidden" id="overScreen">
  <div class="center-box">
    <div class="brand" style="color:#f87171" id="overTitle">ЗАБЕГ ОКОНЧЕН</div>
    <div class="sinfo" id="overStats"></div>
    <button class="main-cta" id="btnRetry" type="button">БЕЖАТЬ СНОВА</button>
    <button class="sec-cta" id="btnOverShop" type="button">МАГАЗИН И СКИНЫ</button>
  </div>
</div>
<script>
const STORAGE_KEY = 'rails_fury_3d_hd_v6';
const gameData = {
  coins: 800, best: 0, skin: 'jake', board: 'classic', boot: 'runner', jetpack: 'spark',
  ownedSkins: ['jake', 'tricky', 'fresh', 'yutani'], ownedBoards: ['classic'], ownedBoots: ['runner'], ownedJets: ['spark'],
  magnetLvl: 1, shieldLvl: 1, sound: true
};
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const p = JSON.parse(raw);
    if (typeof p.coins === 'number') gameData.coins = p.coins;
    if (typeof p.best === 'number') gameData.best = p.best;
    if (typeof p.skin === 'string') gameData.skin = p.skin;
    if (typeof p.board === 'string') gameData.board = p.board;
    if (typeof p.boot === 'string') gameData.boot = p.boot;
    if (typeof p.jetpack === 'string') gameData.jetpack = p.jetpack;
    if (Array.isArray(p.ownedSkins) && p.ownedSkins.length) gameData.ownedSkins = p.ownedSkins;
    if (Array.isArray(p.ownedBoards) && p.ownedBoards.length) gameData.ownedBoards = p.ownedBoards;
    if (Array.isArray(p.ownedBoots) && p.ownedBoots.length) gameData.ownedBoots = p.ownedBoots;
    if (Array.isArray(p.ownedJets) && p.ownedJets.length) gameData.ownedJets = p.ownedJets;
    if (typeof p.magnetLvl === 'number') gameData.magnetLvl = p.magnetLvl;
    if (typeof p.shieldLvl === 'number') gameData.shieldLvl = p.shieldLvl;
    if (typeof p.sound === 'boolean') gameData.sound = p.sound;
  }
} catch (_) {}
function saveGameData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(gameData)); } catch (_) {} }

const SKINS = [
  { id: 'jake', name: 'Джейк', price: 0, skinTone: 0xffcca3, hair: 0xfacc15, hoodie: 0x2563eb, pants: 0x0ea5e9, scarf: 0xef4444, shoe: 0xf97316, css: 'linear-gradient(135deg,#2563eb,#ef4444)', desc: 'Классический раннер с красным шарфом и худи' },
  { id: 'tricky', name: 'Трики', price: 300, skinTone: 0x8d5524, hair: 0x18181b, hoodie: 0xec4899, pants: 0xa855f7, scarf: 0x22d3ee, shoe: 0x38bdf8, css: 'linear-gradient(135deg,#ec4899,#22d3ee)', desc: 'Бирюзовый шарф и розовый худи' },
  { id: 'fresh', name: 'Фреш', price: 650, skinTone: 0x5c3824, hair: 0x111827, hoodie: 0x16a34a, pants: 0xfacc15, scarf: 0xf97316, shoe: 0xef4444, css: 'linear-gradient(135deg,#16a34a,#facc15)', desc: 'Жёлтые штаны и зелёный оверсайз' },
  { id: 'yutani', name: 'Ютани', price: 1100, skinTone: 0xffdfb8, hair: 0x38bdf8, hoodie: 0x7c3aed, pants: 0xe879f9, scarf: 0xfacc15, shoe: 0x22d3ee, css: 'linear-gradient(135deg,#7c3aed,#38bdf8)', desc: 'Фиолетовая толстовка и яркие акценты' }
];
const BOARDS = [
  { id: 'classic', name: 'Рейл-Про', price: 0, color: 0xfb7185, css: 'linear-gradient(90deg,#fb7185,#e11d48)', desc: 'Гасит 1 столкновение' },
  { id: 'maglev', name: 'Маглев-X', price: 300, color: 0x38bdf8, css: 'linear-gradient(90deg,#38bdf8,#0284c7)', desc: 'Плавный ход на рельсах' },
  { id: 'gold', name: 'Золотой Лайнер', price: 750, color: 0xfacc15, css: 'linear-gradient(90deg,#facc15,#ca8a04)', desc: '+50% к монетам' },
  { id: 'hyper', name: 'Гиперион', price: 1500, color: 0xc084fc, css: 'linear-gradient(90deg,#c084fc,#7e22ce)', desc: 'Долгая работа доски (14с)' }
];
const BOOTS = [
  { id: 'runner', name: 'Кеды «Старт»', price: 0, color: 0x94a3b8, jumpBoost: 1.0, css: 'linear-gradient(90deg,#64748b,#cbd5e1)', desc: 'Базовая высота прыжка' },
  { id: 'spring', name: 'Пружинные Буты', price: 350, color: 0x22c55e, jumpBoost: 1.18, css: 'linear-gradient(90deg,#16a34a,#86efac)', desc: '+18% к высоте прыжка' },
  { id: 'skywalk', name: 'Антиграв-Сапоги', price: 900, color: 0x38bdf8, jumpBoost: 1.32, css: 'linear-gradient(90deg,#0284c7,#7dd3fc)', desc: '+32% к прыжку' }
];
const JETPACKS = [
  { id: 'spark', name: 'Искра-Р1', price: 0, color: 0xf97316, duration: 5.5, css: 'linear-gradient(90deg,#ea580c,#fdba74)', desc: 'Полёт 5.5 сек' },
  { id: 'turbo', name: 'Турбо-Вектор', price: 500, color: 0x38bdf8, duration: 8.0, css: 'linear-gradient(90deg,#0ea5e9,#a5f3fc)', desc: 'Полёт 8.0 сек' },
  { id: 'nova', name: 'Нова-Джет', price: 1100, color: 0xe879f9, duration: 11.0, css: 'linear-gradient(90deg,#c026d3,#f5d0fe)', desc: 'Полёт 11.0 сек' }
];
const BIOMES = [
  { name: 'Городские пути', skyTop: 0x1d4ed8, skyMid: 0x38bdf8, skyBot: 0xbae6fd, fog: 0x60a5fa, sunColor: 0xfffbeb, accent: 0x38bdf8, groundSide: 0x334155, propColorA: 0x475569, propColorB: 0x3b82f6, horizonColor: 0x2563eb },
  { name: 'Закатный проспект', skyTop: 0x4c1d95, skyMid: 0xe11d48, skyBot: 0xfbbf24, fog: 0xf43f5e, sunColor: 0xffedd5, accent: 0xfb923c, groundSide: 0x451a2b, propColorA: 0x9f1239, propColorB: 0xf59e0b, horizonColor: 0xbe123c },
  { name: 'Портовый док', skyTop: 0x0f766e, skyMid: 0x14b8a6, skyBot: 0x99f6e4, fog: 0x2dd4bf, sunColor: 0xecfeff, accent: 0x2dd4bf, groundSide: 0x1e3a3a, propColorA: 0x0f766e, propColorB: 0x0284c7, horizonColor: 0x0d9488 }
];

let audioCtx = null;
function playTone(freq, dur, type = 'sine', vol = 0.065) {
  if (!gameData.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = vol; gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

let activeSection = 'skins', displayedFps = 60, mode = 'menu';
let score = 0, runCoins = 0, combo = 1;
let bossTimer = 0, darkTunnelTimer = 0, shieldActive = false, magnetBoostTimer = 0, superJumpBoostTimer = 0;
let dashTimer = 0, dashCd = 0, boardTimer = 0, boardCd = 0, jetTimer = 0, jetCharge = 100;

function updateHud() {
  document.getElementById('hScore').textContent = Math.floor(score);
  document.getElementById('hCoins').textContent = gameData.coins;
  document.getElementById('hCombo').textContent = 'x' + combo;
  document.getElementById('hFps').textContent = String(displayedFps);
  document.getElementById('hBest').textContent = gameData.best;
  document.getElementById('mCoins').textContent = gameData.coins;
  document.getElementById('hSound').textContent = gameData.sound ? '🔊' : '🔇';
  const bHud = document.getElementById('boostsHud');
  let bHtml = '';
  if (bossTimer > 0) bHtml += `<div class="b-pill boss">🚂 БОСС-ЛОКОМОТИВ: ${bossTimer.toFixed(1)}с</div>`;
  if (darkTunnelTimer > 0) bHtml += `<div class="b-pill ev">🚇 ТЁМНЫЙ ТОННЕЛЬ: ${darkTunnelTimer.toFixed(1)}с</div>`;
  if (shieldActive) bHtml += `<div class="b-pill shield">🛡️ ЭНЕРГОЩИТ АКТИВЕН</div>`;
  if (magnetBoostTimer > 0) bHtml += `<div class="b-pill">🧲 Магнит: ${magnetBoostTimer.toFixed(1)}с</div>`;
  if (superJumpBoostTimer > 0) bHtml += `<div class="b-pill">🦘 Супер-прыжок: ${superJumpBoostTimer.toFixed(1)}с</div>`;
  bHud.innerHTML = bHtml;
  const dBtn = document.getElementById('btnDash'); dBtn.disabled = mode !== 'playing' || dashTimer > 0 || dashCd > 0; dBtn.textContent = dashTimer > 0 ? '⚡ РЫВОК' : (dashCd > 0 ? `⚡ ${dashCd.toFixed(1)}с` : '⚡ Рывок');
  const bBtn = document.getElementById('btnBoard'); bBtn.disabled = mode !== 'playing' || boardTimer > 0 || boardCd > 0; bBtn.textContent = boardTimer > 0 ? `🛹 ${boardTimer.toFixed(1)}с` : (boardCd > 0 ? `🛹 ${boardCd.toFixed(1)}с` : '🛹 Доска');
  const jBtn = document.getElementById('btnJet'); jBtn.disabled = mode !== 'playing' || jetTimer > 0 || jetCharge < 100; jBtn.textContent = jetTimer > 0 ? `🚀 ${jetTimer.toFixed(1)}с` : `🚀 Джетпак (${Math.floor(jetCharge)}%)`;
}

function renderShop() {
  const grid = document.getElementById('shopGrid'); grid.innerHTML = '';
  const renderList = (list, ownedKey, eqKey) => {
    list.forEach(item => {
      const owned = gameData[ownedKey].includes(item.id), eq = gameData[eqKey] === item.id;
      const card = document.createElement('div'); card.className = 'scard' + (eq ? ' eq' : '');
      card.innerHTML = `<div class="preview-strip" style="background:${item.css}"></div><div class="stitle">${item.name}</div><div class="sinfo">${item.desc}</div>`;
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'sbtn ' + (eq ? 'done' : (owned ? 'pick' : ''));
      btn.textContent = eq ? 'Надето' : (owned ? 'Выбрать' : `Купить · ${item.price}`);
      btn.onclick = () => {
        if (eq) return;
        if (owned) { gameData[eqKey] = item.id; saveGameData(); rebuildPlayerSkin(); renderShop(); updateHud(); }
        else if (gameData.coins >= item.price) { gameData.coins -= item.price; gameData[ownedKey].push(item.id); gameData[eqKey] = item.id; saveGameData(); rebuildPlayerSkin(); renderShop(); updateHud(); }
        else playTone(180, 0.1, 'sawtooth');
      };
      card.appendChild(btn); grid.appendChild(card);
    });
  };
  if (activeSection === 'skins') renderList(SKINS, 'ownedSkins', 'skin');
  else if (activeSection === 'boards') renderList(BOARDS, 'ownedBoards', 'board');
  else if (activeSection === 'boots') renderList(BOOTS, 'ownedBoots', 'boot');
  else if (activeSection === 'jetpacks') renderList(JETPACKS, 'ownedJets', 'jetpack');
  else {
    const ups = [
      { k: 'magnetLvl', n: 'Магнит и заряд', d: `Ускоряет заряд джетпака и длительность бустов (Ур. ${gameData.magnetLvl}/5)`, cost: gameData.magnetLvl * 160 },
      { k: 'shieldLvl', n: 'Броня от дрона', d: `Держит дрон-перехватчик дальше от тебя (Ур. ${gameData.shieldLvl}/5)`, cost: gameData.shieldLvl * 180 }
    ];
    ups.forEach(u => {
      const max = gameData[u.k] >= 5, card = document.createElement('div'); card.className = 'scard';
      card.innerHTML = `<div class="preview-strip" style="background:linear-gradient(90deg,#3b82f6,#a855f7)"></div><div class="stitle">${u.n}</div><div class="sinfo">${u.d}</div>`;
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'sbtn ' + (max ? 'done' : '');
      btn.textContent = max ? 'МАКС' : `Качать · ${u.cost}`;
      btn.onclick = () => { if (!max && gameData.coins >= u.cost) { gameData.coins -= u.cost; gameData[u.k]++; saveGameData(); renderShop(); updateHud(); } };
      card.appendChild(btn); grid.appendChild(card);
    });
  }
}
document.querySelectorAll('.ntab').forEach(tab => {
  tab.onclick = () => { document.querySelectorAll('.ntab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); activeSection = tab.dataset.sec; renderShop(); };
});
function setScreen(id) {
  ['mainScreen', 'pauseScreen', 'overScreen'].forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
  document.getElementById('hud').classList.toggle('hidden', id !== null);
}
renderShop(); updateHud();

const canvas = document.getElementById('gameCanvas');
const LANE_X = [2.5, 0, -2.5];

function createSharpTextures(kind) {
  const size = 512, colorC = document.createElement('canvas'), roughC = document.createElement('canvas');
  colorC.width = roughC.width = size; colorC.height = roughC.height = size;
  const cg = colorC.getContext('2d'), rg = roughC.getContext('2d');
  if (kind === 'ballast') {
    cg.fillStyle = '#263144'; cg.fillRect(0, 0, size, size);
    rg.fillStyle = '#c8c8c8'; rg.fillRect(0, 0, size, size);
    for (let i = 0; i < 1400; i++) {
      const v = 60 + ((i * 19) % 46);
      cg.fillStyle = `rgb(${v},${v + 8},${v + 16})`;
      cg.fillRect((i * 73 + (i % 13) * 11) % size, (i * 127 + (i % 17) * 9) % size, 5, 4);
    }
    for (let yPos = 0; yPos < size; yPos += 64) {
      cg.fillStyle = '#473022'; cg.fillRect(0, yPos + 10, size, 24);
      cg.fillStyle = '#9c6c4e'; cg.fillRect(0, yPos + 10, size, 4);
    }
  } else if (kind === 'trainBody') {
    const g = cg.createLinearGradient(0, 0, size, 0);
    g.addColorStop(0, '#1e40af'); g.addColorStop(0.5, '#2563eb'); g.addColorStop(1, '#1e40af');
    cg.fillStyle = g; cg.fillRect(0, 0, size, size);
    rg.fillStyle = '#686868'; rg.fillRect(0, 0, size, size);
    cg.fillStyle = '#eab308'; cg.fillRect(0, 212, size, 44);
    cg.fillStyle = '#e2e8f0'; cg.fillRect(0, 202, size, 10);
  } else {
    cg.fillStyle = '#eab308'; cg.fillRect(0, 0, size, size);
    rg.fillStyle = '#787878'; rg.fillRect(0, 0, size, size);
    cg.fillStyle = '#0f172a';
    for (let i = -size; i < size * 2; i += 64) {
      cg.beginPath(); cg.moveTo(i, 0); cg.lineTo(i + 32, 0); cg.lineTo(i - size + 32, size); cg.lineTo(i - size, size); cg.closePath(); cg.fill();
    }
  }
  const map = new THREE.CanvasTexture(colorC), roughnessMap = new THREE.CanvasTexture(roughC);
  map.anisotropy = 4; roughnessMap.anisotropy = 4;
  map.wrapS = map.wrapT = THREE.RepeatWrapping; roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
  return { map, roughnessMap };
}

function updateSmoothBiomeTransition(dt) {
  const rate = Math.min(1, dt * 2.2);
  fog.color.lerp(targetFogColor, rate); dirLight.color.lerp(targetSunColor, rate); rimLight.color.lerp(targetRimColor, rate); sideGroundMat.color.lerp(targetSideGround, rate);
  skyMat.uniforms.uTop.value.lerp(targetSkyTop, rate); skyMat.uniforms.uMid.value.lerp(targetSkyMid, rate); skyMat.uniforms.uBot.value.lerp(targetSkyBot, rate);
  props.forEach(g => { if (g.userData.matA) g.userData.matA.color.lerp(targetPropA, rate); if (g.userData.matB) g.userData.matB.color.lerp(targetPropB, rate); });
  horizonMeshes.forEach(h => { if (h.userData.mat) h.userData.mat.color.lerp(targetHorizonColor, rate); });
}

function buildTrainMesh(w, h, d, hasLadder) {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(w, h - 0.24, d), trainMat);
  hull.position.set(0, (h - 0.24) * 0.5, d * 0.5);
  hull.castShadow = true; hull.receiveShadow = true;
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.14, 0.22, d + 0.2), roofMat);
  roof.position.set(0, h - 0.11, d * 0.5);
  roof.castShadow = true;
  const edgeStrip = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.12, d), ladderMat);
  edgeStrip.position.set(0, h - 0.24, d * 0.5);
  const winCount = Math.max(2, Math.floor(d / 4.5));
  for (let i = 0; i < winCount; i++) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.46, 1.3), windowMat);
    win.position.set(0, h * 0.62, 1.8 + i * (d / winCount));
    g.add(win);
  }
  g.add(hull, roof, edgeStrip);
  if (hasLadder) {
    const ladderGroup = new THREE.Group();
    const runLen = 2.6;
    const rampLen = Math.hypot(runLen, h);
    const angle = Math.atan2(h, runLen);
    const railL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, rampLen), ladderMat); railL.position.set(-0.42, 0, 0);
    const railR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, rampLen), ladderMat); railR.position.set(0.42, 0, 0);
    ladderGroup.add(railL, railR);
    const steps = 6;
    for (let s = 1; s < steps; s++) {
      const t = s / steps;
      const stepBar = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.07, 0.09), ladderMat);
      stepBar.position.set(0, (t - 0.5) * h, (t - 0.5) * runLen);
      ladderGroup.add(stepBar);
    }
    ladderGroup.rotation.x = -angle;
    ladderGroup.position.set(0, h * 0.5, -runLen * 0.5);
    g.add(ladderGroup);
  }
  return g;
}

function buildBarrierMesh(kind, w) {
  const g = new THREE.Group();
  if (kind === 'low') {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.85, 0.85), hazardMat);
    b.position.set(0, 0.425, 0); b.castShadow = true; g.add(b);
  } else if (kind === 'high') {
    const postL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 2.0, 0.14), roofMat); postL.position.set(-w * 0.44, 1.0, 0);
    const postR = new THREE.Mesh(new THREE.BoxGeometry(0.14, 2.0, 0.14), roofMat); postR.position.set(w * 0.44, 1.0, 0);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.85, 0.85), hazardMat);
    b.position.set(0, 1.45, 0); b.castShadow = true;
    g.add(postL, postR, b);
  } else {
    const postL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.35, 0.14), roofMat); postL.position.set(-w * 0.44, 0.675, 0);
    const postR = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.35, 0.14), roofMat); postR.position.set(w * 0.44, 0.675, 0);
    const bot = new THREE.Mesh(new THREE.BoxGeometry(w, 0.34, 0.85), hazardMat); bot.position.set(0, 0.17, 0);
    const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.34, 0.85), hazardMat); top.position.set(0, 1.05, 0);
    g.add(postL, postR, bot, top);
  }
  return g;
}

function showAlert(text, warn = false, sec = 2.4) { const el = document.getElementById('alertBox'); el.textContent = text; el.classList.toggle('warn', warn); el.classList.add('show'); alertTimer = sec; }
function triggerShake(mag = 0.25, dur = 0.22) { shakeMag = Math.max(shakeMag, mag); shakeTimer = Math.max(shakeTimer, dur); }
function bumpCombo() { combo = Math.min(8, combo + 1); comboTimer = 3.4; }
function clearWorld() { obstacles.forEach(o => scene.remove(o.mesh)); pickups.forEach(p => scene.remove(p.mesh)); particles.forEach(pt => scene.remove(pt.mesh)); obstacles = []; pickups = []; particles.length = 0; }

function addCoinsLine(l, yPos, zStart, count, stepZ) {
  for (let i = 0; i < count; i++) {
    const cMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.16, 16), coinMat); cMesh.rotation.x = Math.PI / 2; cMesh.position.set(LANE_X[l], yPos, zStart + i * stepZ);
    scene.add(cMesh); pickups.push({ mesh: cMesh, kind: 'coin', lane: l, y: yPos, z: zStart + i * stepZ });

}

function addBoostPickup(l, kind, yPos, zPos) {
  const geo = kind === 'magnet' ? new THREE.TorusGeometry(0.46, 0.15, 10, 18) : (kind === 'jump' ? new THREE.OctahedronGeometry(0.52, 0) : new THREE.IcosahedronGeometry(0.52, 0));

function spawnBossWave() {

function spawnWave() {
  if (bossTimer > 0) { spawnBossWave(); return; }
  const z = 114, l = Math.floor(Math.random() * 3);
  if (Math.random() < 0.46) {
    const hasLadder = Math.random() < 0.6, isLong = Math.random() < 0.5, h = 2.5, d = isLong ? 24 : 14, w = 2.05;
    const mesh = buildTrainMesh(w, h, d, hasLadder); mesh.position.set(LANE_X[l], 0, z); scene.add(mesh);
    obstacles.push({ mesh, lane: l, z, w, h, d, hasLadder, isTrain: true, rampStart: hasLadder ? z - 2.6 : 9999, rampEnd: hasLadder ? z + 0.35 : -9999 });
    addCoinsLine(l, 3.1, z + 1.5, isLong ? 6 : 4, 3.1);
  } else {
    const kRoll = Math.random(), kind = kRoll < 0.34 ? 'low' : (kRoll < 0.67 ? 'high' : 'dual'), w = 1.95;
    const mesh = buildBarrierMesh(kind, w); mesh.position.set(LANE_X[l], 0, z); scene.add(mesh);
    obstacles.push({ mesh, lane: l, z, w, d: 0.9, isTrain: false, kind });
    addCoinsLine(l, 0.85, z + 3, 3, 2.5);
  }

    const bLane = (l + 1) % 3, pr = Math.random(), bKind = pr < 0.38 ? 'magnet' : (pr < 0.74 ? 'jump' : 'shield');
    addBoostPickup(bLane, bKind, 1.0, z - 5.5);

}

let sx = 0, sy = 0;
canvas.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
canvas.addEventListener('touchend', e => {
  if (mode !== 'playing') return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) { lane = Math.max(0, Math.min(2, lane + (dx > 0 ? 1 : -1))); playTone(360, 0.06); }
  else if (dy < 0) doJump();
  else if (jetTimer <= 0) { if (!grounded) vy = -18.5; rollTimer = 0.58; playTone(200, 0.09); }
}, { passive: true });

window.addEventListener('keydown', e => {
  if (mode !== 'playing') return;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') lane = Math.max(0, Math.min(2, lane + 1));
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') lane = Math.max(0, Math.min(2, lane - 1));
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') doJump();
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { if (jetTimer <= 0) { if (!grounded) vy = -18.5; rollTimer = 0.58; } }
  else if (e.code === 'Space' || e.code === 'ShiftLeft') document.getElementById('btnDash').click();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); applyRendererSize(Math.min(window.devicePixelRatio || 1, 1.5));
});

function animateSurferRig(rig, t, leanX, isRolling, onBoard, climbing, flying, dashing) {
  const cycle = t * 15.5;
  rig.torsoPivot.rotation.z = -leanX * 0.3; rig.torsoPivot.rotation.y = leanX * 0.24; rig.headPivot.rotation.y = -leanX * 0.16;
  rig.scarfTail.rotation.z = Math.sin(t * 18) * 0.22 - leanX * 0.25;
  if (flying) {
    rig.hips.position.y = 0.84; rig.torsoPivot.rotation.x = 0.56; rig.legL.hip.rotation.x = 0.42; rig.legR.hip.rotation.x = 0.26;
    const fScale = 0.8 + 0.45 * Math.sin(t * 36); rig.flameL.scale.set(1, fScale, 1); rig.flameR.scale.set(1, fScale, 1);
  } else if (isRolling) {
    rig.hips.position.y = 0.44; rig.torsoPivot.rotation.x = 0.9; rig.legL.hip.rotation.x = -1.1; rig.legR.hip.rotation.x = -0.9;
  } else if (onBoard) {
    rig.hips.position.y = 0.92; rig.torsoPivot.rotation.x = 0.12; rig.legL.hip.rotation.x = -0.28; rig.legR.hip.rotation.x = 0.22;
  } else {
    rig.hips.position.y = 0.84 + Math.abs(Math.sin(cycle)) * 0.09; rig.torsoPivot.rotation.x = dashing ? 0.34 : 0.12;
    rig.legL.hip.rotation.x = Math.sin(cycle) * 0.9; rig.legR.hip.rotation.x = -Math.sin(cycle) * 0.9;
    rig.legL.knee.rotation.x = -Math.max(0, -Math.cos(cycle)) * 1.0; rig.legR.knee.rotation.x = -Math.max(0, Math.cos(cycle)) * 1.0;
    rig.armL.sh.rotation.x = -Math.sin(cycle) * 0.8; rig.armR.sh.rotation.x = Math.sin(cycle) * 0.8;
  }
}

function handleObstacleHit(obsIdx) {
  if (shieldActive) { shieldActive = false; playerRig.shieldBubble.visible = false; triggerShake(0.22, 0.2); scene.remove(obstacles[obsIdx].mesh); obstacles.splice(obsIdx, 1); return true; }
  if (boardTimer > 0) { boardTimer = 0; playerRig.boardMesh.visible = false; triggerShake(0.22, 0.2); scene.remove(obstacles[obsIdx].mesh); obstacles.splice(obsIdx, 1); return true; }
  combo = Math.max(1, Math.ceil(combo * 0.5)); triggerShake(0.32, 0.26); copDist -= 2.5;
  if (copDist <= 1.4) { finishRun(); return false; }
  playTone(170, 0.2, 'sawtooth', 0.1); scene.remove(obstacles[obsIdx].mesh); obstacles.splice(obsIdx, 1); return true;
}

let fpsAccumTime = 0, fpsFrames = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const rawDt = (now - prev) / 1000; prev = now;
  if (rawDt <= 0 || rawDt > 0.25) { renderer.render(scene, camera); return; }
  const dt = Math.min(rawDt, 0.06); animClock += dt;
  fpsAccumTime += rawDt; fpsFrames++;
  if (fpsAccumTime >= 0.5) { displayedFps = Math.min(144, Math.round(fpsFrames / fpsAccumTime)); fpsAccumTime = 0; fpsFrames = 0; }
  updateSmoothBiomeTransition(dt);

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i]; pt.life -= dt; pt.vy -= 18 * dt;
    pt.mesh.position.x += pt.vx * dt; pt.mesh.position.y += pt.vy * dt; pt.mesh.position.z += pt.vz * dt;
    if (pt.life <= 0) { scene.remove(pt.mesh); particles.splice(i, 1); }
  }

  if (mode === 'playing') {
    runElapsed += dt;
    if (!bossSpawnedOnce && runElapsed >= 20.0) { bossSpawnedOnce = true; bossTimer = 11.0; bossSpawnCd = 0.4; bossGroup.visible = true; bossGroup.position.set(0, 0, 66); showAlert('🚂 БОСС-ЛОКОМОТИВ НА ПУТЯХ!', true, 2.6); }
    if (bossTimer > 0) {
      bossTimer = Math.max(0, bossTimer - dt);
      bossGroup.position.x += (Math.sin(animClock * 1.4) * 0.55 - bossGroup.position.x) * Math.min(1, dt * 5);
      bossGroup.position.z += ((bossTimer < 1.5 ? 70 : 44) - bossGroup.position.z) * Math.min(1, dt * 3.5);
      bossSpawnCd -= dt; if (bossSpawnCd <= 0 && bossTimer > 1.8) { spawnBossWave(); bossSpawnCd = 1.75; }
      if (bossTimer === 0) { bossGroup.visible = false; score += 200; bumpCombo(); showAlert('✅ БОСС ОТСТУПИЛ! +200', false, 2.0); }
    }

    if (dashTimer > 0) dashTimer = Math.max(0, dashTimer - dt);
    if (dashCd > 0) dashCd = Math.max(0, dashCd - dt);
    speed = Math.min(42, speed + dt * 0.14);
    const dz = speed * dt * (dashTimer > 0 ? 1.55 : 1.0) * (darkTunnelTimer > 0 ? 1.12 : 1.0);
    score += dz * 1.35 * (1 + (combo - 1) * 0.12);
    ballastPBR.map.offset.y -= dz * 0.14; ballastPBR.roughnessMap.offset.y -= dz * 0.14; trainPBR.map.offset.x += dz * 0.015;
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 1; }
    jetCharge = Math.min(100, jetCharge + dt * (6.5 + gameData.magnetLvl * 1.4));
    if (magnetBoostTimer > 0) magnetBoostTimer = Math.max(0, magnetBoostTimer - dt);
    if (superJumpBoostTimer > 0) superJumpBoostTimer = Math.max(0, superJumpBoostTimer - dt);

    if (darkTunnelTimer <= 0 && score >= nextTunnelScore) { darkTunnelTimer = 13.0; nextTunnelScore += 950; setBiomeTargets(activeBiome, true); showAlert('🚇 ТЁМНЫЙ ТОННЕЛЬ!', false, 2.5); }
    if (darkTunnelTimer > 0) {
      darkTunnelTimer = Math.max(0, darkTunnelTimer - dt);
      tunnelArches.forEach(a => { a.position.z -= dz * 1.25; if (a.position.z < -12) a.position.z += 160; });
      if (darkTunnelTimer === 0) setBiomeTargets(activeBiome, false);
    }
    if (alertTimer > 0) { alertTimer -= dt; if (alertTimer <= 0) document.getElementById('alertBox').classList.remove('show'); }

    const targetBiome = Math.floor(score / 1000) % BIOMES.length;
    if (targetBiome !== activeBiome) { activeBiome = targetBiome; setBiomeTargets(activeBiome, darkTunnelTimer > 0); showAlert(`🌍 ${BIOMES[activeBiome].name.toUpperCase()}`, false, 2.2); }

    props.forEach(p => { p.position.z -= dz; if (p.position.z < -22) p.position.z += 144; });
    horizonMeshes.forEach(m => { m.position.z -= dz * 0.28; if (m.position.z < -36) m.position.z += 192; });

    const prevX = curX; curX += (LANE_X[lane] - curX) * Math.min(1, dt * 17);
    const leanX = Math.max(-1, Math.min(1, (curX - prevX) / Math.max(0.001, dt * 14)));
    if (rollTimer > 0) rollTimer = Math.max(0, rollTimer - dt);
    if (boardTimer > 0) { boardTimer -= dt; if (boardTimer <= 0) playerRig.boardMesh.visible = false; }
    if (boardCd > 0) boardCd = Math.max(0, boardCd - dt);
    if (jetTimer > 0) { jetTimer -= dt; y += (5.4 - y) * Math.min(1, dt * 8); vy = 0; grounded = false; if (jetTimer <= 0) { playerRig.jetGroup.visible = false; vy = -2; } }
    copDist = Math.min(6.5, copDist + dt * (0.35 + gameData.shieldLvl * 0.08));

    let supportedOnRoof = false;
    const isRolling = rollTimer > 0 && jetTimer <= 0, pBottom = y, pTop = y + (isRolling ? 0.85 : 1.75);
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i]; o.z -= dz; if (o.hasLadder) { o.rampStart -= dz; o.rampEnd -= dz; } o.mesh.position.z = o.z;
      if (jetTimer <= 0 && dashTimer <= 0 && Math.abs(curX - LANE_X[o.lane]) < (o.w * 0.5 + 0.32)) {
        if (o.isTrain) {
          if (o.hasLadder && o.rampStart < 0.45 && o.rampEnd > -0.45 && y < o.h) {
            const prog = Math.max(0, Math.min(1, (0.45 - o.rampStart) / Math.max(0.1, o.rampEnd - o.rampStart)));
            y = Math.max(y, prog * o.h); vy = 0; if (y >= o.h - 0.05) { y = o.h; grounded = true; supportedOnRoof = true; }
          } else if (o.z < 0.75 && o.z + o.d > -0.75) {
            if (y >= o.h - 0.35 && vy <= 2.2) { y = o.h; vy = 0; grounded = true; supportedOnRoof = true; }
            else if (y < o.h - 0.35 && pTop > 0.05 && !handleObstacleHit(i)) return;
          }
        } else if (o.z < 0.75 && o.z + o.d > -0.75) {
          const hit = o.kind === 'low' ? (pBottom < 0.85 && pTop > 0.05) : (o.kind === 'high' ? (pTop > 1.02 && pBottom < 1.88) : ((pBottom < 0.35 && pTop > 0.05) || (pBottom < 1.22 && pTop > 0.88)));
          if (hit && !handleObstacleHit(i)) return;
        }
      }
      if (o.z + o.d < -14) { scene.remove(o.mesh); obstacles.splice(i, 1); }
    }

    if (jetTimer <= 0 && !supportedOnRoof && y > 0 && grounded) grounded = false;
    if (jetTimer <= 0 && !grounded) { vy -= 29 * dt; y += vy * dt; if (y <= 0) { y = 0; vy = 0; grounded = true; } }

    camY += (4.3 + y * 0.85 - camY) * Math.min(1, dt * 10);
    camRoll += (-leanX * 0.03 - camRoll) * Math.min(1, dt * 12);
    camera.position.set(curX * 0.45, camY, -8.2); camera.rotation.z = camRoll; camera.lookAt(curX * 0.35, 1.7 + y * 0.75, 16);
    animateSurferRig(playerRig, animClock, leanX, isRolling, boardTimer > 0, false, jetTimer > 0, dashTimer > 0);
    playerRig.root.position.set(curX, y, 0); playerRig.shieldBubble.visible = shieldActive;
    playerGlow.position.set(curX, y + 2.2, 1.8); dirLight.position.set(curX + 12, 22, -10); dirLight.target.position.set(curX, 0, 8); rimLight.position.set(curX, y + 2.4, 1.5);
    droneGroup.position.x += (curX - droneGroup.position.x) * Math.min(1, dt * 11);
    droneGroup.position.y = Math.abs(Math.sin(animClock * 12)) * 0.22; droneGroup.position.z = -copDist;

    spawnTimer -= dt; if (spawnTimer <= 0) { spawnWave(); spawnTimer = bossTimer > 0 ? 1.85 : Math.max(0.8, 1.38 - (speed - 22) * 0.015); }
    const mult = gameData.board === 'gold' ? 1.5 : 1;
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i]; p.z -= dz;
      const px = (p.kind === 'coin' && magnetBoostTimer > 0 && p.z < 24 && p.z > -4) ? curX : LANE_X[p.lane];
      const py = (p.kind === 'coin' && magnetBoostTimer > 0 && p.z < 24 && p.z > -4) ? (y + 1.0) : p.y;
      p.mesh.position.set(px, py, p.z); p.mesh.rotation.y += dt * 3.2;
      if (p.z < 1.25 && p.z > -1.25 && Math.abs(curX - px) < 1.28 && Math.abs((y + 0.9) - py) < 1.55) {
        if (p.kind === 'coin') { const g = Math.max(1, Math.round(1 * mult)); gameData.coins += g; runCoins += g; score += 15 * combo; bumpCombo(); jetCharge = Math.min(100, jetCharge + 4 + gameData.magnetLvl * 1.2); spawnBurst(px, py, p.z, 0xfacc15, 4); playTone(880, 0.06, 'sine', 0.05); }
        else if (p.kind === 'magnet') { magnetBoostTimer = 8 + gameData.magnetLvl * 1.5; showAlert('🧲 МАГНИТ!', false, 1.6); }
        else if (p.kind === 'jump') { superJumpBoostTimer = 8 + gameData.magnetLvl * 1.5; showAlert('🦘 СУПЕР-ПРЫЖОК!', false, 1.6); }
        else if (p.kind === 'shield') { shieldActive = true; playerRig.shieldBubble.visible = true; showAlert('🛡️ ЩИТ!', false, 1.6); }
        scene.remove(p.mesh); pickups.splice(i, 1); continue;
      }
      if (p.z < -8) { scene.remove(p.mesh); pickups.splice(i, 1); }
    }
    updateHud();
  } else if (mode === 'menu') {
    animateSurferRig(playerRig, animClock * 0.45, Math.sin(animClock * 0.6) * 0.25, false, false, false, false, false);
    playerRig.root.position.set(0, 0, 0); droneGroup.position.set(-1.35, 0.15 + Math.sin(animClock * 2.2) * 0.1, -2.7);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
